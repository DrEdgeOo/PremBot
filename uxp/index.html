<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PremBot</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <div class="brand">PremBot</div>
        <span id="helper-pill" class="pill pill-warn" title="Helper status">
            helper: checking…
        </span>
        <button id="btn-settings" class="ghost">Settings</button>
    </header>

    <section id="settings" class="panel hidden">
        <h3>Settings</h3>
        <label>
            Anthropic API key
            <input id="cfg-key" type="password" placeholder="sk-ant-...">
        </label>
        <label>
            OpenAI API key <span class="muted">(for Whisper transcription)</span>
            <input id="cfg-openai-key" type="password" placeholder="sk-...">
        </label>
        <label>
            Media folder <span class="muted">(where source audio lives - for bulk transcribe)</span>
            <input id="cfg-media-folder" type="text" placeholder="E:\Video">
        </label>
        <label>
            Model
            <select id="cfg-model">
                <option value="claude-sonnet-4-6">claude-sonnet-4-6 (fast)</option>
                <option value="claude-opus-4-7">claude-opus-4-7 (smart)</option>
                <option value="claude-haiku-4-5-20251001">claude-haiku-4-5 (cheap)</option>
            </select>
        </label>
        <div class="row">
            <button id="btn-save-settings">Save</button>
            <span id="settings-status" class="muted"></span>
        </div>
    </section>

    <section class="panel">
        <h3>Edit with AI</h3>
        <div class="row">
            <label class="quick-label">Quick action</label>
            <select id="quick-actions" class="quick-select">
                <option value="">— pick a prepared prompt —</option>
                <option data-prompt="Reverse the order of all clips on V1.">Timeline: Reverse V1 clip order</option>
                <option data-prompt="Shift every clip on V1 forward by 5 seconds.">Timeline: Shift V1 forward 5s</option>
                <option data-prompt="Add a comment marker on the active sequence every 5 seconds for the first 30 seconds.">Timeline: Add markers every 5s (first 30s)</option>
                <option data-prompt="List every clip currently on V1 and tell me their durations.">Timeline: List V1 clip durations</option>
                <option data-prompt="Trim the V1 clip at 0s so its timeline end is 5 seconds.">Trim (helper): Trim V1 clip 0 to 5s</option>
                <option data-prompt="Split the active sequence at 10 seconds, then list the new clip structure on V1.">Trim (helper): Split sequence at 10s</option>
                <option data-prompt="Transcribe every V1 clip using my media folder, then list which clips have transcripts.">Transcript: Bulk transcribe V1</option>
                <option data-prompt="Transcribe V1 and find every filler word ('um', 'uh', 'like', 'you know'), reporting the exact timeline positions.">Transcript: Find filler words on V1</option>
                <option data-prompt="Transcribe V1, then save the transcripts as SRT files imported into the project bin so I can drop them on caption tracks.">Transcript: Auto-caption to bin</option>
                <option data-prompt="Apply a cinematic teal-and-orange color grade to every clip on V1.">Color: Teal &amp; orange grade (all V1)</option>
                <option data-prompt="Grade every V1 clip with a warm golden-hour look at 80% intensity.">Color: Warm golden hour (all V1, 0.8x)</option>
                <option data-prompt="Apply a moody noir grade to the first V1 clip.">Color: Moody noir (first V1 clip)</option>
                <option data-prompt="Grade every V1 clip with a cool cyberpunk look.">Color: Cool cyberpunk (all V1)</option>
                <option data-prompt="Reset Lumetri Color to neutral on every V1 clip (undo prior grading).">Color: Neutral reset (all V1)</option>
                <option data-prompt="Export a frame from the current playhead, look at it, then suggest and apply Lumetri Color parameters that improve the image. Explain your reasoning.">Color: Vision-driven grade (playhead frame)</option>
                <option data-prompt="Use analyze_v1_frames_for_grade to look at every V1 clip, then apply per-shot Lumetri parameters tailored to each clip's lighting and color. Explain the grade for each shot briefly.">Color: Per-shot vision grade (all V1)</option>
                <option data-prompt="Apply the Lumetri Color built-in Look 'Kodak 2393 (by Adobe)' to every V1 clip via set_lumetri_params with the Look property.">Color: Look - Kodak 2393 (all V1)</option>
                <option data-prompt="List the current Lumetri Color parameters on the first V1 clip.">Color: Inspect first V1 clip's grade</option>
                <option data-prompt="Look at every V1 clip via analyze_v1_frames_for_grade, decide on a unified cinematic look that fits the content, then use generate_and_apply_lut to bake a .cube LUT named after the look and apply it to every V1 clip. Tell me where the .cube file was saved.">LUT: Vision-driven custom LUT (all V1)</option>
                <option data-prompt="Generate a .cube LUT for a 'cinematic teal-and-orange' look named teal_orange_v1 and save it. Don't apply to any clips - I just want the file.">LUT: Generate teal-and-orange .cube (file only)</option>
                <option data-prompt="Generate a 'moody noir' .cube LUT named moody_noir_v1 and apply it to every V1 clip.">LUT: Generate and apply moody noir to V1</option>
                <option data-prompt="List every audio clip on the timeline with its current Volume Level in dB.">Audio: List clip levels</option>
                <option data-prompt="Add a 1-second fade-in to the first audio clip and a 1-second fade-out to the last audio clip on A1.">Audio: Fade in/out A1 ends</option>
                <option data-prompt="Normalize every clip on A2 to -15 dB so the music bed sits consistently behind dialog.">Audio: Normalize A2 to -15 dB</option>
                <option data-prompt="Transcribe V1 (if not already), then auto-duck the music on A2 down to -12 dB whenever speech is present on V1, with 0.25 s ramps and 0.15 s padding around each speech interval.">Audio: Auto-duck A2 under V1 dialog</option>
                <option data-prompt="Detect the BPM and beat times for the music clip on A2 by looking up its audio file via clipName. Tell me the BPM and how many beats you found, but don't make any cuts yet.">Beats: Detect BPM on A2 music</option>
                <option data-prompt="Detect beats on the A2 music clip, shift the beat times by the music clip's timeline start, then drop a comment marker at every beat (cap 80) so I can preview the grid before committing to cuts.">Beats: Preview beat grid with markers</option>
                <option data-prompt="Detect beats on the A2 music clip, shift to timeline seconds, then razor V1 at every beat (skipping micro-clips under 0.25 s) for a music-video edit.">Beats: Cut V1 to A2 beats (music video edit)</option>
                <option data-prompt="Detect beats on the A2 music clip and align every existing V1 clip to land on a beat. Shift the beats to timeline seconds first.">Beats: Align V1 clips to A2 beats</option>
            </select>
        </div>
        <textarea id="ai-prompt" rows="3"
            placeholder="Pick a quick action above, or type your own prompt..."></textarea>
        <div class="row">
            <button id="btn-run">Run</button>
            <button id="btn-cancel" class="ghost" disabled>Cancel</button>
            <button id="btn-copy-log" class="ghost">Copy log</button>
            <span id="run-status" class="muted"></span>
        </div>
        <pre id="log" class="log"></pre>
    </section>

    <section class="panel collapsible">
        <div class="row collapse-toggle" id="diag-toggle">
            <h3 style="margin:0">Diagnostics</h3>
            <span id="diag-caret" class="muted">▸ show</span>
        </div>
        <div id="diag-body" class="hidden">
            <div class="actions">
                <button id="btn-ping">Ping</button>
                <button id="btn-project">List project clips</button>
                <button id="btn-sequence">List timeline clips</button>
                <button id="btn-probe">Probe factories</button>
            </div>
            <div class="actions">
                <button id="btn-move">Move V1 clip 0 to 5s</button>
                <button id="btn-clone">Clone V1 clip 0 to end</button>
                <button id="btn-disable">Toggle disable V1 clip 0</button>
                <button id="btn-clear-v1">Clear V1 (destructive)</button>
                <button id="btn-probe-ripple">Probe ripple-delete</button>
                <button id="btn-probe-transcript">Probe transcript</button>
                <button id="btn-probe-import">Probe import-captions</button>
                <button id="btn-probe-caption">Probe caption track</button>
                <button id="btn-probe-export-tx">Export existing transcript</button>
                <button id="btn-probe-min-tx">Probe minimal transcript</button>
                <button id="btn-probe-export">Probe frame-export APIs</button>
                <button id="btn-probe-export-live">Test frame export (live)</button>
                <button id="btn-probe-export-readback">Test frame readback</button>
            </div>
            <div class="output-bar">
                <button id="btn-copy">Copy output</button>
                <span id="copy-status"></span>
            </div>
            <pre id="output" class="diag-out"></pre>
        </div>
    </section>

    <script src="./index.js"></script>
    <script src="./helper-client.js"></script>
    <script src="./transcripts.js"></script>
    <script src="./audio.js"></script>
    <script src="./agent.js"></script>
    <script src="./ui.js"></script>
</body>
</html>
